name: Release

# 触发条件：推送 lh-ui-harmony@x.y.z 格式的 tag（由 pnpm release:push 完成）。
# 注意：GitHub Actions 的 tag 过滤里 * 不匹配 /，含 / 的 tag 必须用 **。
#
# 原生端的留档策略与 web 血脉不同：本仓不发布 npm 包，也没有可直接拉取的
# 安装包，故用 git archive 打源码 zip 挂载到发行版。**不做 CI 构建**——
# 令牌目录 tokens/ 是 codegen 生成物且被 gitignore，远程 clone 无法编译；
# 且鸿蒙只能用 DevEco 构建（仓内无 hvigorw）。HAR 包由本地 DevEco 环境
# assembleHar 产出，走 ohpm 发包通道（见 docs/发包流程.md §5.5），
# 不经过本流水线。
# workflow_dispatch 用于重跑某个已有 tag 的发行版创建（例如上次 Gitee 侧失败）。
on:
  push:
    tags:
      - 'lh-ui-harmony@**'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重建发行版的已有 tag，如 lh-ui-harmony@0.1.0'
        required: true

permissions:
  contents: write # gh release create 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析 tag 并做格式守卫
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^lh-ui-harmony@[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag [$TAG] 不是 lh-ui-harmony@x.y.z 格式，跳过"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#lh-ui-harmony@}" >> "$GITHUB_OUTPUT"

      - name: 生成 release notes
        if: steps.meta.outputs.skip != 'true'
        # 首次发版 CHANGELOG 尚未生成，兜底一段说明不阻断留档
        run: |
          if node scripts/release-notes.mjs "${{ steps.meta.outputs.version }}" > release-notes.md 2>/dev/null; then
            cat release-notes.md
          else
            printf '## %s\n\n首个发行版。详见 CHANGELOG.md 与提交历史。\n' "${{ steps.meta.outputs.version }}" > release-notes.md
          fi

      - name: 打源码 zip
        if: steps.meta.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          git archive --format=zip --output "lh-ui-harmony-${VERSION}-src.zip" HEAD

      - name: 创建 GitHub Release 并挂载源码 zip
        if: steps.meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="lh-ui-harmony-${{ steps.meta.outputs.version }}-src.zip"
          # 已存在（重跑场景，例如上次 Gitee 侧失败）只重传资产，不重复创建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      # Gitee 的 tag 与发行版由本流程统一接管，本地只推 GitHub，避免双写冲突
      - name: 推送 tag 到 Gitee
        if: steps.meta.outputs.skip != 'true'
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          git remote add gitee "https://oauth2:${{ secrets.GITEE_TOKEN }}@gitee.com/lh-ui/harmony.git" || true
          git push gitee "${TAG}" 2>/dev/null \
            || echo "⚠️ Gitee 上已存在该 tag，跳过推送"

      # Gitee 发行版正文带 GitHub Release 的下载链接（Gitee 附件 API 不稳定，不依赖）
      - name: 创建 Gitee 发行版
        if: steps.meta.outputs.skip != 'true'
        continue-on-error: true # GitHub Release 已成功，Gitee 侧失败不阻塞主流程
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          printf '\n\n> 📦 源码包（.zip）：https://github.com/lhgb-top/lh-ui-harmony/releases/download/%s/lh-ui-harmony-%s-src.zip\n' \
            "$TAG" "${{ steps.meta.outputs.version }}" >> release-notes.md
          jq -n --arg token "$GITEE_TOKEN" --arg tag "$TAG" --rawfile notes release-notes.md \
            '{access_token:$token, tag_name:$tag, name:$tag, body:$notes, target_commitish:"master"}' \
            | curl -sS -f -X POST "https://gitee.com/api/v5/repos/lh-ui/harmony/releases" \
                -H "Content-Type: application/json" -d @-
